# L3-маршрутизация свитча TA100 (читает l3d). На коробке: /var/bcm/l3.conf.
# VLAN-раскладка — отдельно, в vlan.conf. Здесь: какие VLAN маршрутизируются и адрес шлюза.
#
#   l3 <vid> <ip/префикс>        — шлюз VLAN: Linux-интерфейс vlan<vid> (KNET) + L3-интерфейс в чипе
#   route <префикс> via <шлюз>    — статический маршрут (шлюз должен быть в одной из сетей l3)
#   mac <xx:xx:xx:xx:xx:xx>       — MAC роутера (по умолчанию 02:<MAC eth0 без 1-го байта>), общий
#                                   для всех L3-VLAN и постоянный между загрузками
#
# Хосты (соседи ядра) l3d сам переносит в аппаратную таблицу чипа; пока хоста там нет,
# пакеты маршрутизирует Linux (ip_forward) — медленно, но без потерь.
# Пустой файл = L3 выключен, свитч работает как чистый L2.
#
# Стенд с DL380 (24.10):
l3 10 192.168.10.1/24
l3 20 192.168.20.1/24
