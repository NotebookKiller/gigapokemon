# Раскладка VLAN свитча TA100 — номера клеток как на панели (1-48, Q1-Q4).
# На коробке: /var/bcm/vlan.conf. Применяется при загрузке (box-start -> vlan-gen.sh -> vlan.soc,
# rc.soc делает rcload) или на ходу (см. RUNBOOK-deploy.md, раздел VLAN).
#
#   vlan <vid> [имя] [untagged=<клетки>] [tagged=<клетки>]
#
# untagged — access-порты этого VLAN (уходят из VLAN 1, PVID = vid).
# tagged   — транки: VLAN идёт с тегом, а VLAN 1 по-прежнему без тега (native 1).
# Всё, что не упомянуто как untagged, остаётся в VLAN 1. Пустой файл = один плоский L2-домен.
#
# Пример (раскомментировать и поправить):
# vlan 10 office untagged=1-12        tagged=48
# vlan 20 cams   untagged=13-16,21-24 tagged=48,Q1
#
# Стенд с DL380 (24.10): h10 = клетка 35, h20 = клетка 33.
vlan 10 h10 untagged=35
vlan 20 h20 untagged=33
